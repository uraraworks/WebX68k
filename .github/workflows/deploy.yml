name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Pages のデプロイは途中でキャンセルすると配信側に中途半端な状態が残り、後続が
  # deployment_queued のまま返ってこなくなることがある(GitHub 公式のスターター
  # ワークフローが Pages 向けに false を指定しているのはこのため)。連続プッシュ時は
  # 打ち切らずに順番待ちさせる。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # CORS未対応の配布元(OneDrive除く)向けの中継サービスのURL。リポジトリ変数
          # DISK_PROXY_URL が未設定でも空文字でビルドが通る(fork時の既定値)。
          # ワークフロー内に直書きしない理由: 直書きするとforkしたリポジトリのビルドが
          # そのままこちらのVPS宛の中継URLを埋め込んでしまい、他人の中継先に無関係な
          # トラフィックを送りつけることになる。中継URLは各自のリポジトリ変数として
          # 設定してもらう運用にし、未設定時は中継なし(直接fetchのみ)にフォールバックする。
          VITE_DISK_PROXY: ${{ vars.DISK_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 既定の10分では Pages 側が deployment_queued のまま返ってこず打ち切られることがある
          # (2026-08-06 に4回連続で Timeout reached, aborting!)。ビルドとアップロードは常に
          # 成功しているので、単に待ちを長くする。上限まで待っても失敗するなら Pages 側の問題。
          timeout: 1800000
