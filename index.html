<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebX68k - X68000 Emulator</title>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>WebX68k</h1>
      <p class="app-tagline">The online X68000 emulator powered by px68k-libretro</p>
    </header>

    <main>
      <div class="console-card">
        <div class="stage">
          <canvas id="screen" width="768" height="512"></canvas>
        </div>
        <div class="console-footer">
          <div class="toolbar">
            <button id="btn-start" class="primary">起動</button>
            <button id="btn-reset" disabled>リセット</button>
            <button id="btn-eject" disabled>ディスク取り出し</button>
          </div>
        </div>
      </div>

      <section id="panel">
        <h2>BIOS 設定</h2>
        <div class="field-row">
          <label>IPLROM.DAT</label>
          <input id="bios-ipl" type="file" accept=".dat" />
          <span id="bios-ipl-status" class="status-ng">未設定</span>
        </div>
        <div class="field-row">
          <label>CGROM.DAT</label>
          <input id="bios-cg" type="file" accept=".dat" />
          <span id="bios-cg-status" class="status-ng">未設定</span>
        </div>

        <h2 style="margin-top:16px;">ディスクイメージ</h2>
        <div id="dropzone">
          ここに .xdf / .dim / .d88 / .hdm / .img ファイルをドラッグ＆ドロップ<br />
          （またはクリックして選択）
          <input id="disk-input" type="file" accept=".xdf,.dim,.d88,.hdm,.img" style="display:none;" />
        </div>
      </section>

      <footer id="statusbar">
        <span>FPS: <b id="stat-fps">-</b></span>
        <span>解像度: <b id="stat-res">-</b></span>
        <span>ディスク: <b id="stat-disk">未挿入</b></span>
      </footer>
    </main>

    <footer class="app-footer">
      <a href="https://www.urara-works.jp/" target="_blank" rel="noopener">© URARA-works</a> /
      <a href="https://github.com/uraraworks/WebX68k" target="_blank" rel="noopener">GitHubで見る</a><br />
      Powered by <a href="https://github.com/uraraworks/px68k-libretro" target="_blank" rel="noopener">px68k</a> (GPLv2)
    </footer>
  </div>

  <script src="/core/px68k_libretro.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
